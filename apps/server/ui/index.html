<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Infra Manager</title>
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("infra-theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = choice === "dark" || (choice !== "light" && dark) ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeChoice = choice === "light" || choice === "dark" ? choice : "system";
        } catch (error) { /* le système décide */ }
      })();
    </script>
    <link rel="stylesheet" href="/ui/assets/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/ui/assets/app.js"></script>
  </body>
</html>
